apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
    spec:
      containers:
      - name: my-k8s-app
        image: bunny1007/my-k8s-app:latest   # ✅ FIXED
        imagePullPolicy: Always
        ports:
        - containerPort: 3000   # ⚠️ CHANGE if needed
